apiVersion: apps/v1
kind: Deployment

metadata:
  name: myapp
  namespace: myapp

spec:
  replicas: 2

  selector:
    matchLabels:
      app: myapp

  template:
    metadata:
      labels:
        app: myapp

    spec:
      imagePullSecrets:
        - name: ecr-secret

      containers:
        - name: myapp

          image: 890615325308.dkr.ecr.ap-south-1.amazonaws.com/demoproject

          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"
